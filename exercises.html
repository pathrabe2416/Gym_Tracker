<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Gym Tracker — Exercises</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #151515;
    --card-border: #232323;
    --text: #f5f5f5;
    --muted: #9a9a9a;
    --green: #8fd13f;
    --green-dark: #5e8f2a;
    --blue: #4a90e2;
    --red: #e0473f;
    --purple: #a259d9;
    --yellow: #f2c94c;
    --teal: #2fd1c5;
    --orange: #f2843c;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  /* App Shell */
  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--bg);
    padding: 70px 18px 95px;
    position: relative;
  }

  a { color: inherit; text-decoration: none; }
  button, input, select { font-family: inherit; }

  /* Header */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    z-index: 100;
    padding: 12px 18px;
    background: var(--bg);
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    border-bottom: 1px solid var(--card-border);
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
  }

  .brand {
    display: flex;
    flex-direction: column;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: .5px;
    font-size: 15px;
    text-align: center;
  }
  .brand .accent { color: var(--green); }

  .add-custom-btn {
    background: #1c2c14;
    color: var(--green);
    border: 1px solid #2e4a1c;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  h1.page-title {
    font-size: 26px;
    margin: 0 0 4px;
    font-weight: 800;
  }

  .subtext {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 16px;
  }

  /* Search & Filter Controls */
  .search-wrap {
    position: relative;
    margin-bottom: 14px;
  }

  .search-input {
    width: 100%;
    background: #131313;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px 12px 40px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s ease;
  }

  .search-input:focus {
    border-color: var(--green);
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .clear-search {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    display: none;
  }
  .clear-search.show { display: block; }

  /* Muscle Category Scroll */
  .category-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 14px;
    scrollbar-width: none;
  }
  .category-scroll::-webkit-scrollbar { display: none; }

  .cat-chip {
    background: #141414;
    border: 1px solid var(--card-border);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    white-space: nowrap;
    cursor: pointer;
    transition: all .2s ease;
  }

  .cat-chip.active {
    background: var(--green);
    color: #101d06;
    border-color: var(--green);
    font-weight: 700;
  }

  /* Sub Filter Selectors */
  .filter-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .filter-select {
    flex: 1;
    background: #121212;
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    outline: none;
  }

  .fav-toggle {
    background: #121212;
    border: 1px solid var(--card-border);
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .fav-toggle.active {
    background: #2a220a;
    border-color: var(--yellow);
    color: var(--yellow);
  }

  /* Exercise List Grid */
  .exercise-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .ex-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: transform .15s ease, border-color .15s ease;
    position: relative;
  }

  .ex-card:active {
    transform: scale(0.99);
  }

  .ex-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .ex-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ex-icon-box {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #1f1f1f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    border: 1px solid #2a2a2a;
  }

  .ex-name-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 3px;
  }

  .ex-target-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .fav-btn {
    background: none;
    border: none;
    color: #4a4a4a;
    cursor: pointer;
    padding: 4px;
    transition: color .2s ease;
  }

  .fav-btn.is-fav {
    color: var(--yellow);
  }

  .ex-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: .3px;
  }

  .tag.muscle {
    background: #1c2c14;
    color: var(--green);
  }

  .tag.equipment {
    background: #122030;
    color: var(--blue);
  }

  .tag.difficulty {
    background: #231d2b;
    color: var(--purple);
  }

  .ex-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #202020;
    padding-top: 10px;
    margin-top: 2px;
  }

  .ex-info-item {
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .add-workout-btn {
    background: var(--green);
    color: #122007;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .add-workout-btn:active { filter: brightness(0.9); }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 40px 10px;
    color: var(--muted);
  }
  .empty-state svg {
    margin-bottom: 12px;
    color: #333;
  }

  /* Modal Drawer for Details & Custom Exercise */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-sheet {
    background: #141414;
    border-top: 1px solid var(--card-border);
    border-radius: 22px 22px 0 0;
    width: 100%;
    max-width: 430px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
    position: relative;
    animation: slideUp .25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .modal-close-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    background: #222;
    border: none;
    color: var(--muted);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-title {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 6px;
  }

  .modal-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .step-list {
    margin: 12px 0;
    padding-left: 20px;
  }
  .step-list li {
    font-size: 13.5px;
    color: #d0d0d0;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .tip-box {
    background: #132210;
    border: 1px solid #28441d;
    border-radius: 12px;
    padding: 12px;
    margin: 14px 0;
    font-size: 12.5px;
    color: #c3e2af;
  }
  .tip-box b { color: var(--green); display: block; margin-bottom: 4px; }

  /* Form inputs for Custom Exercise */
  .form-group {
    margin-bottom: 14px;
  }
  .form-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
    text-transform: uppercase;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13.5px;
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--green);
  }

  /* Bottom Nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: #0a0a0a;
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: space-around;
    padding: 10px 4px 14px;
    z-index: 100;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-item.active { color: var(--green); }
  .nav-item svg { width: 21px; height: 21px; }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1c2c14;
    color: var(--green);
    border: 1px solid #2e4a1c;
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 500;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

// LocalStorage Keys
const STORAGE_KEY = 'gymTrackerData';
const CUSTOM_EX_KEY = 'gymTrackerCustomExercises';
const FAV_EX_KEY = 'gymTrackerFavExercises';

// State
let selectedCategory = 'All';
let searchQuery = '';
let selectedEquipment = 'All';
let selectedDifficulty = 'All';
let showFavsOnly = false;
let favoriteIds = JSON.parse(localStorage.getItem(FAV_EX_KEY) || '[]');
let customExercises = JSON.parse(localStorage.getItem(CUSTOM_EX_KEY) || '[]');

// Merge Base + Custom Exercises
function getAllExercises() {
  return [...BASE_EXERCISES, ...customExercises];
}

// DOM Elements
const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearchBtn');
const categoryScroll = document.getElementById('categoryScroll');
const equipmentFilter = document.getElementById('equipmentFilter');
const difficultyFilter = document.getElementById('difficultyFilter');
const favToggleBtn = document.getElementById('favToggleBtn');
const exerciseList = document.getElementById('exerciseList');
const detailModal = document.getElementById('detailModal');
const closeDetailModal = document.getElementById('closeDetailModal');
const modalDetailContent = document.getElementById('modalDetailContent');
const customModal = document.getElementById('customModal');
const openCustomModal = document.getElementById('openCustomModal');
const closeCustomModal = document.getElementById('closeCustomModal');
const saveCustomBtn = document.getElementById('saveCustomBtn');

// Render Function
function renderExercises() {
  const all = getAllExercises();

  const filtered = all.filter(ex => {
    // Muscle category
    if (selectedCategory !== 'All' && ex.muscle.toLowerCase() !== selectedCategory.toLowerCase()) {
      return false;
    }
    // Search query
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      const matchName = ex.name.toLowerCase().includes(q);
      const matchMuscle = ex.muscle.toLowerCase().includes(q);
      const matchEquip = ex.equipment.toLowerCase().includes(q);
      if (!matchName && !matchMuscle && !matchEquip) return false;
    }
    // Equipment
    if (selectedEquipment !== 'All' && ex.equipment.toLowerCase() !== selectedEquipment.toLowerCase()) {
      return false;
    }
    // Difficulty
    if (selectedDifficulty !== 'All' && ex.difficulty.toLowerCase() !== selectedDifficulty.toLowerCase()) {
      return false;
    }
    // Favorites
    if (showFavsOnly && !favoriteIds.includes(ex.id)) {
      return false;
    }
    return true;
  });

  if (!filtered.length) {
    exerciseList.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <div style="font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text);">No Exercises Found</div>
        <div style="font-size:12.5px;">Try clearing filters or searching for something else.</div>
      </div>
    `;
    return;
  }

  exerciseList.innerHTML = filtered.map(ex => {
    const isFav = favoriteIds.includes(ex.id);
    return `
      <div class="ex-card" onclick="openExerciseDetail('${ex.id}')">
        <div class="ex-header">
          <div class="ex-title-wrap">
            <div class="ex-icon-box">${ex.icon || '🏋️'}</div>
            <div>
              <div class="ex-name-text">${ex.name}</div>
              <div class="ex-target-sub">${ex.setsReps || '3 sets × 10 reps'}</div>
            </div>
          </div>
          <button class="fav-btn ${isFav ? 'is-fav' : ''}" onclick="event.stopPropagation(); toggleFavorite('${ex.id}')" aria-label="Favorite">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </button>
        </div>

        <div class="ex-tags">
          <span class="tag muscle">${ex.muscle}</span>
          <span class="tag equipment">${ex.equipment}</span>
          <span class="tag difficulty">${ex.difficulty}</span>
        </div>

        <div class="ex-footer">
          <div class="ex-info-item">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Learn Form
          </div>
          <button class="add-workout-btn" onclick="event.stopPropagation(); addToWorkout('${ex.name}', '${ex.muscle}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Add to Workout
          </button>
        </div>
      </div>
    `;
  }).join('');
}

// Favorite Toggle
function toggleFavorite(id) {
  if (favoriteIds.includes(id)) {
    favoriteIds = favoriteIds.filter(i => i !== id);
    showToast('Removed from favorites');
  } else {
    favoriteIds.push(id);
    showToast('Saved to favorites ⭐');
  }
  localStorage.setItem(FAV_EX_KEY, JSON.stringify(favoriteIds));
  renderExercises();
}

// Add to Workout
function addToWorkout(name, muscle) {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    let data = raw ? JSON.parse(raw) : {};
    
    if (!data.activeWorkout) {
      data.activeWorkout = {
        name: "Custom Workout",
        durationMin: 45,
        exercises: []
      };
    }

    const exists = data.activeWorkout.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (!exists) {
      data.activeWorkout.exercises.push({
        id: Date.now(),
        name: name,
        sets: 3,
        reps: "10–12",
        muscle: muscle
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      showToast(`Added ${name} to Workout! 💪`);
    } else {
      showToast(`${name} is already in workout`);
    }
  } catch(e) {
    console.error(e);
  }
}

// Open Detail Modal
function openExerciseDetail(id) {
  const all = getAllExercises();
  const ex = all.find(e => e.id === id);
  if (!ex) return;

  const isFav = favoriteIds.includes(ex.id);
  const stepsList = ex.steps ? ex.steps.map(s => `<li>${s}</li>`).join('') : '<li>Perform under control with proper form.</li>';

  modalDetailContent.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div class="ex-icon-box" style="width:50px;height:50px;font-size:24px;">${ex.icon || '🏋️'}</div>
      <div>
        <div class="modal-title">${ex.name}</div>
        <div class="ex-tags">
          <span class="tag muscle">${ex.muscle}</span>
          <span class="tag equipment">${ex.equipment}</span>
          <span class="tag difficulty">${ex.difficulty}</span>
        </div>
      </div>
    </div>

    <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">
      Target: <b style="color:var(--text);">${ex.muscle}</b> ${ex.secondary ? `(Secondary: ${ex.secondary.join(', ')})` : ''}
    </div>

    <div style="font-weight:700;font-size:14px;margin-top:14px;margin-bottom:6px;color:var(--green);">Step-by-Step Instructions</div>
    <ol class="step-list">
      ${stepsList}
    </ol>

    ${ex.tip ? `
      <div class="tip-box">
        <b>💡 Pro Form Tip</b>
        ${ex.tip}
      </div>
    ` : ''}

    ${ex.mistake ? `
      <div style="background:#281210;border:1px solid #4a1d18;border-radius:12px;padding:12px;margin-bottom:14px;font-size:12.5px;color:#f0b2aa;">
        <b style="color:var(--red);display:block;margin-bottom:4px;">❌ Common Mistake</b>
        ${ex.mistake}
      </div>
    ` : ''}

    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="add-workout-btn" style="flex:1;padding:12px;font-size:13.5px;justify-content:center;" onclick="addToWorkout('${ex.name}', '${ex.muscle}'); closeDetailSheet();">
        Add to Workout Routine
      </button>
      <button class="fav-toggle ${isFav ? 'active' : ''}" style="padding:12px 16px;" onclick="toggleFavorite('${ex.id}'); openExerciseDetail('${ex.id}');">
        ⭐ ${isFav ? 'Favorited' : 'Favorite'}
      </button>
    </div>
  `;

  detailModal.classList.add('open');
}

function closeDetailSheet() {
  detailModal.classList.remove('open');
}

// Event Listeners
searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  clearSearchBtn.classList.toggle('show', searchQuery.length > 0);
  renderExercises();
});

clearSearchBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  clearSearchBtn.classList.remove('show');
  renderExercises();
});

// Category Chips
categoryScroll.addEventListener('click', (e) => {
  if (e.target.classList.contains('cat-chip')) {
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    selectedCategory = e.target.dataset.cat;
    renderExercises();
  }
});

// Sub-filters
equipmentFilter.addEventListener('change', (e) => {
  selectedEquipment = e.target.value;
  renderExercises();
});

difficultyFilter.addEventListener('change', (e) => {
  selectedDifficulty = e.target.value;
  renderExercises();
});

favToggleBtn.addEventListener('click', () => {
  showFavsOnly = !showFavsOnly;
  favToggleBtn.classList.toggle('active', showFavsOnly);
  renderExercises();
});

// Modal Close Listeners
closeDetailModal.addEventListener('click', closeDetailSheet);
detailModal.addEventListener('click', (e) => {
  if (e.target === detailModal) closeDetailSheet();
});

// Custom Exercise Modal
openCustomModal.addEventListener('click', () => {
  customModal.classList.add('open');
});
closeCustomModal.addEventListener('click', () => {
  customModal.classList.remove('open');
});
customModal.addEventListener('click', (e) => {
  if (e.target === customModal) customModal.classList.remove('open');
});

// Save Custom Exercise
saveCustomBtn.addEventListener('click', () => {
  const name = document.getElementById('customName').value.trim();
  const muscle = document.getElementById('customMuscle').value;
  const equipment = document.getElementById('customEquipment').value;
  const difficulty = document.getElementById('customDifficulty').value;
  const notes = document.getElementById('customNotes').value.trim();

  if (!name) {
    alert('Please enter an exercise name.');
    return;
  }

  const newEx = {
    id: 'custom-' + Date.now(),
    name: name,
    icon: '✨',
    muscle: muscle,
    equipment: equipment,
    difficulty: difficulty,
    setsReps: '3 sets × 10–12 reps',
    steps: notes ? [notes] : ['Perform with controlled tempo and good form.'],
    tip: 'Custom user exercise.',
    isCustom: true
  };

  customExercises.unshift(newEx);
  localStorage.setItem(CUSTOM_EX_KEY, JSON.stringify(customExercises));

  // Reset & Close
  document.getElementById('customName').value = '';
  document.getElementById('customNotes').value = '';
  customModal.classList.remove('open');

  showToast(`Custom Exercise "${name}" Added!`);
  renderExercises();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Initial Render
renderExercises();
</script>
